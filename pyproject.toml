[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kahin"
version = "0.3.0"
description = "Kahin, hibrit bir CDP ansiklopedisi, anti-detect browser otomasyon MCP sidir. Yerleşik olarak obscura ve camoufox kullanır, dinamik olarak göreve göre seçer. Seçimi ajanınız yapar."
license = { text = "AGPL-3.0-or-later" }
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0,<2",
    "orjson>=3.10",
    "pydantic>=2.0",
    "Levenshtein>=0.26",
    "websockets>=14.0",
    "httpx>=0.28",
    "Pillow>=11.0",
]

[project.optional-dependencies]
stealth = ["camoufox>=0.1"]

[project.scripts]
kahin = "kahin.oracle:main"

[tool.hatch.build.targets.wheel]
packages = ["kahin"]

[tool.hatch.build.targets.wheel.force-include]
"kahin/the_source/protocol.json.gz" = "kahin/the_source/protocol.json.gz"
"camoufox-harness/vendor/bin/kahin-sidecar" = "kahin/_vendor/kahin-sidecar"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pyright]
pythonVersion = "3.14"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
