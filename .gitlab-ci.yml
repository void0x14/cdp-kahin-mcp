image: node:20

stages:
  - verify
  - publish

release-check:
  stage: verify
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq python3
  script:
    - bash scripts/release-check.sh
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - package.json
        - pyproject.toml
        - uv.lock
        - kahin/**
        - lib/**
        - bin/setup.mjs
        - CHANGELOG.md
        - README.md
        - docs/**
        - camoufox-harness/**
        - scripts/**

real-e2e:
  stage: verify
  image: ghcr.io/astral-sh/uv:python3.14-bookworm
  before_script:
    - apt-get update -qq
    - >-
      apt-get install -y -qq curl xz-utils passwd util-linux libgtk-3-0
      libdbus-glib-1-2 libdbus-1-3 libasound2 libx11-xcb1 libxcomposite1
      libxdamage1 libxfixes3 libxrandr2 libxtst6 libxss1 libatk1.0-0
      libpango-1.0-0 libcairo2 xvfb xauth libgl1 libgl1-mesa-dri
      libegl1 libglx-mesa0 libgbm1
    # Camoufox/Firefox must not be launched as Docker root. Keep the build
    # setup privileged, then run the real browser gate as an unprivileged user.
    - useradd --create-home --user-group --shell /bin/bash kahin-ci
    - chown -R kahin-ci:kahin-ci "$CI_PROJECT_DIR"
  script:
    - >-
      xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24 -ac"
      runuser --user kahin-ci -- env HOME=/home/kahin-ci TZ=Etc/UTC
      LIBGL_ALWAYS_SOFTWARE=1 MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
      GALLIUM_DRIVER=llvmpipe PATH="$PATH"
      bash scripts/real-e2e.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stealth-regression:
  stage: verify
  image: ghcr.io/astral-sh/uv:python3.14-bookworm
  before_script:
    - apt-get update -qq
    - >-
      apt-get install -y -qq curl xz-utils passwd util-linux libgtk-3-0
      libdbus-glib-1-2 libdbus-1-3 libasound2 libx11-xcb1 libxcomposite1
      libxdamage1 libxfixes3 libxrandr2 libxtst6 libxss1 libatk1.0-0
      libpango-1.0-0 libcairo2 xvfb xauth libgl1 libgl1-mesa-dri
      libegl1 libglx-mesa0 libgbm1
    # Mirror real-e2e: Camoufox/Firefox must not be launched as Docker
    # root — keep the build setup privileged, run the browser gate
    # unprivileged.
    - useradd --create-home --user-group --shell /bin/bash kahin-ci
    - chown -R kahin-ci:kahin-ci "$CI_PROJECT_DIR"
  script:
    - |
      xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24 -ac" \
      runuser --user kahin-ci -- env \
        HOME=/home/kahin-ci TZ=Etc/UTC \
        LIBGL_ALWAYS_SOFTWARE=1 MESA_LOADER_DRIVER_OVERRIDE=llvmpipe \
        GALLIUM_DRIVER=llvmpipe PATH="$PATH" bash -c '
        set -euo pipefail
        cd "$CI_PROJECT_DIR"
        # Rebuild the Zig sidecar from this checkout (mirror
        # scripts/real-e2e.sh) so a stale vendored binary cannot make
        # engine changes look tested.
        ZIG_BIN="${KAHIN_ZIG_BIN:-}"
        ZIG_TMP=""
        cleanup_zig() { if [[ -n "$ZIG_TMP" ]]; then rm -rf -- "$ZIG_TMP"; fi; }
        trap cleanup_zig EXIT
        if [[ -z "$ZIG_BIN" ]] && command -v zig >/dev/null 2>&1; then
          ZIG_CANDIDATE="$(command -v zig)"
          case "$($ZIG_CANDIDATE version)" in
            0.16.*) ZIG_BIN="$ZIG_CANDIDATE" ;;
            *) echo "ignoring incompatible system Zig; fetching pinned 0.16.x" ;;
          esac
        fi
        if [[ -z "$ZIG_BIN" ]]; then
          ZIG_VERSION="${KAHIN_ZIG_VERSION:-0.16.0}"
          case "$(uname -m)" in
            x86_64|amd64) ZIG_TARGET="x86_64-linux" ;;
            aarch64|arm64) ZIG_TARGET="aarch64-linux" ;;
            *) echo "error: unsupported Zig architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          ZIG_TMP="$(mktemp -d)"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-${ZIG_TARGET}-${ZIG_VERSION}.tar.xz" \
            --output "$ZIG_TMP/zig.tar.xz"
          tar -xJf "$ZIG_TMP/zig.tar.xz" -C "$ZIG_TMP"
          ZIG_BIN="$ZIG_TMP/zig-${ZIG_TARGET}-${ZIG_VERSION}/zig"
        fi
        KAHIN_ZIG_BIN="$ZIG_BIN" bash scripts/build-sidecar.sh
        uv sync --frozen --dev
        uv run python -m camoufox fetch
        KAHIN_REQUIRE_REAL_E2E=1 KAHIN_REQUIRE_STEALTH=1 uv run pytest -q tests/test_e2e_stealth.py
        KAHIN_REQUIRE_STEALTH=1 uv run python scripts/stealth-regression.py
      '
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

release-bump:
  stage: publish
  image: ghcr.io/astral-sh/uv:python3.14-bookworm
  needs: [release-check, real-e2e, stealth-regression]
  resource_group: release
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl git jq nodejs npm
  script:
    - bash scripts/release-bump.sh
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /^chore\(release\): v/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - package.json
        - pyproject.toml
        - uv.lock
        - kahin/**
        - lib/**
        - bin/setup.mjs
        - CHANGELOG.md
        - README.md
        - docs/**
        - camoufox-harness/**
        - scripts/**

npm-publish:
  stage: publish
  needs: [release-check, real-e2e, stealth-regression]
  script:
    - bash scripts/npm-publish.sh
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
