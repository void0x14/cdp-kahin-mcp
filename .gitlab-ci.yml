image: node:20

stages:
  - verify
  - publish

release-check:
  stage: verify
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq python3
  script:
    - bash scripts/release-check.sh
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - package.json
        - pyproject.toml
        - uv.lock
        - kahin/**
        - lib/**
        - bin/setup.mjs
        - CHANGELOG.md

npm-publish:
  stage: publish
  needs: [release-check]
  script:
    - bash scripts/npm-publish.sh
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
